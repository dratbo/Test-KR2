# VPS: полный стек, снаружи только GATEWAY_PORT (по умолчанию 8080).
# docker compose -f docker-compose.vps.yml --env-file deploy/.env up -d --build

name: satiafactory-task-manager

x-db-url: &db-url postgres://${POSTGRES_USER:-dratbo}:${POSTGRES_PASSWORD:-P@ssw0rd}@postgres:5432/${POSTGRES_DB:-satisfactory}?sslmode=disable

services:
  postgres:
    container_name: postgres
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dratbo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-P@ssw0rd}
      POSTGRES_DB: ${POSTGRES_DB:-satisfactory}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dratbo}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  user-service:
    build: ./services/user-service
    container_name: user-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      USER_SERVICE_PORT: "8081"
      DATABASE_URL: *db-url
      JWT_SECRET: ${JWT_SECRET:-Bib233asd18-}
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    networks:
      - app-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  task-service-1:
    build: ./services/task-service
    container_name: task-service-1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8082/metrics"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 45s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    environment:
      TASK_SERVICE_PORT: "8082"
      DATABASE_URL: *db-url
      JWT_SECRET: ${JWT_SECRET:-Bib233asd18-}
      INSTANCE_ID: tasks-1
      REDIS_URL: redis://redis:6379/0
      REDIS_CACHE_TTL: "60"
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    networks:
      - app-network

  task-service-2:
    build: ./services/task-service
    container_name: task-service-2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8082/metrics"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 45s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    environment:
      TASK_SERVICE_PORT: "8082"
      DATABASE_URL: *db-url
      JWT_SECRET: ${JWT_SECRET:-Bib233asd18-}
      INSTANCE_ID: tasks-2
      REDIS_URL: redis://redis:6379/0
      REDIS_CACHE_TTL: "60"
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    networks:
      - app-network

  task-service-3:
    build: ./services/task-service
    container_name: task-service-3
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8082/metrics"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 45s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    environment:
      TASK_SERVICE_PORT: "8082"
      DATABASE_URL: *db-url
      JWT_SECRET: ${JWT_SECRET:-Bib233asd18-}
      INSTANCE_ID: tasks-3
      REDIS_URL: redis://redis:6379/0
      REDIS_CACHE_TTL: "60"
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    networks:
      - app-network

  task-worker:
    build: ./services/task-worker
    container_name: task-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    environment:
      DATABASE_URL: *db-url
      REDIS_URL: redis://redis:6379/0
      REDIS_CACHE_TTL: "60"
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    networks:
      - app-network

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx-lb
    restart: unless-stopped
    depends_on:
      task-service-1:
        condition: service_healthy
      task-service-2:
        condition: service_healthy
      task-service-3:
        condition: service_healthy
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app-network

  satisfactory-data-service:
    build: ./services/satisfactory-data-service
    container_name: data-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SERVICE_PORT: "8083"
      DATABASE_URL: *db-url
      DATA_FILE_PATH: ./data/game-data.json
    networks:
      - app-network

  gateway:
    build: ./services/gateway
    container_name: gateway
    restart: unless-stopped
    depends_on:
      user-service:
        condition: service_started
      nginx:
        condition: service_started
      satisfactory-data-service:
        condition: service_started
    environment:
      GATEWAY_PORT: "8080"
      USER_SERVICE_URL: http://user-service:8081
      TASK_SERVICE_URL: http://nginx:8090
      DATA_SERVICE_URL: http://satisfactory-data-service:8083
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    networks:
      - app-network

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    restart: unless-stopped
    depends_on:
      - gateway
      - user-service
      - task-service-1
      - satisfactory-data-service
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - app-network

  grafana:
    image: grafana/grafana:11.4.0
    container_name: grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
