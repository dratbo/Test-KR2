# Cloudflare Tunnel → gateway:8080 (HTTPS на домене без занятия :443 на VPS).
#
# 1. Создайте туннель: https://one.dash.cloudflare.com/ → Networks → Tunnels
# 2. Public Hostname: HTTP → localhost:8080
# 3. Добавьте в deploy/.env: CLOUDFLARE_TUNNEL_TOKEN=eyJ...
#
# Запуск:
#   docker compose -f docker-compose.balance.yml -f docker-compose.cloudflare.yml --env-file deploy/.env up -d

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    network_mode: host
    depends_on:
      - gateway
