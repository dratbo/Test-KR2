# Caddy: HTTPS на :8080 (порт уже открыт снаружи; 8443 у многих хостеров закрыт).
#
#   docker compose -f docker-compose.balance.yml -f docker-compose.https.yml up -d
#
# UI: https://153.56.132.67:8080  (предупреждение о сертификате — нормально)

services:
  gateway:
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - gateway
    networks:
      - app-network

volumes:
  caddy_data:
  caddy_config:
