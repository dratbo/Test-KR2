<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <marker id="prop-arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#3db8c4"/>
    </marker>
    <marker id="prop-arrow-gray" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#9aa0b4"/>
    </marker>
    <marker id="prop-arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#47c978"/>
    </marker>
    <linearGradient id="prop-boxFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34344a"/>
      <stop offset="100%" stop-color="#2a2a3a"/>
    </linearGradient>
    <linearGradient id="prop-accentFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2f8fd4"/>
      <stop offset="100%" stop-color="#1f6fad"/>
    </linearGradient>
    <filter id="prop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <style>
      .title { font-family: Segoe UI, Arial, sans-serif; font-size: 42px; font-weight: 700; fill: #ffffff; }
      .subtitle { font-family: Segoe UI, Arial, sans-serif; font-size: 22px; fill: #b8bfd0; }
      .box-title { font-family: Segoe UI, Arial, sans-serif; font-size: 26px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .box-sub { font-family: Segoe UI, Arial, sans-serif; font-size: 18px; fill: #d8dce8; text-anchor: middle; }
      .box-tech { font-family: Consolas, monospace; font-size: 16px; fill: #7dd3fc; text-anchor: middle; }
      .edge-label { font-family: Segoe UI, Arial, sans-serif; font-size: 16px; fill: #c8cede; text-anchor: middle; }
      .group-label { font-family: Segoe UI, Arial, sans-serif; font-size: 20px; font-weight: 600; fill: #8f96ab; }
      .footer { font-family: Segoe UI, Arial, sans-serif; font-size: 20px; fill: #9aa0b4; text-anchor: middle; }
      .legend-line { font-family: Segoe UI, Arial, sans-serif; font-size: 18px; fill: #d8dce8; text-anchor: start; }
      .legend-tech { font-family: Consolas, monospace; font-size: 16px; fill: #7dd3fc; text-anchor: start; }
      .note { font-family: Segoe UI, Arial, sans-serif; font-size: 17px; fill: #9aa0b4; text-anchor: middle; font-style: italic; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#171722"/>
  <rect x="40" y="40" width="1840" height="1000" rx="24" fill="#1f2030" stroke="#3a3d52" stroke-width="2"/>

  <text x="960" y="110" class="title" text-anchor="middle">Property Price Predictor</text>
  <text x="960" y="148" class="subtitle" text-anchor="middle">Go REST API | Python ML | React | Docker Compose</text>
  <text x="960" y="172" class="note" text-anchor="middle">Frontend talks only to Go Backend</text>

  <!-- Frontend -->
  <g filter="url(#prop-shadow)">
    <rect x="120" y="260" width="260" height="120" rx="16" fill="url(#prop-boxFill)" stroke="#3db8c4" stroke-width="3"/>
    <text x="250" y="308" class="box-title">Frontend</text>
    <text x="250" y="342" class="box-sub">React 19 | Vite</text>
    <text x="250" y="368" class="box-tech">:5173</text>
  </g>

  <!-- Go Backend -->
  <g filter="url(#prop-shadow)">
    <rect x="520" y="240" width="300" height="160" rx="16" fill="url(#prop-accentFill)" stroke="#9fd4ff" stroke-width="3"/>
    <text x="670" y="296" class="box-title">Go Backend</text>
    <text x="670" y="332" class="box-sub">REST /api | JWT</text>
    <text x="670" y="358" class="box-sub">chi | pgx | bcrypt</text>
    <text x="670" y="384" class="box-tech">:8080</text>
  </g>

  <!-- ML Service -->
  <g filter="url(#prop-shadow)">
    <rect x="960" y="240" width="300" height="160" rx="16" fill="url(#prop-boxFill)" stroke="#47c978" stroke-width="3"/>
    <text x="1110" y="296" class="box-title">ML Service</text>
    <text x="1110" y="332" class="box-sub">FastAPI | scikit-learn</text>
    <text x="1110" y="358" class="box-sub">Random Forest Regressor</text>
    <text x="1110" y="384" class="box-tech">:8000</text>
  </g>

  <!-- Parser -->
  <g filter="url(#prop-shadow)">
    <rect x="960" y="480" width="300" height="130" rx="16" fill="url(#prop-boxFill)" stroke="#e06c9f" stroke-width="2"/>
    <text x="1110" y="528" class="box-title">Parser</text>
    <text x="1110" y="560" class="box-sub">Python | scheduler 24h</text>
    <text x="1110" y="586" class="box-sub">26 cities | cianparser</text>
  </g>

  <!-- PostgreSQL -->
  <g filter="url(#prop-shadow)">
    <rect x="520" y="520" width="340" height="140" rx="16" fill="url(#prop-boxFill)" stroke="#e06c9f" stroke-width="3"/>
    <text x="690" y="572" class="box-title">PostgreSQL</text>
    <text x="690" y="606" class="box-sub">users | properties | favorites</text>
    <text x="690" y="634" class="box-tech">:5433</text>
  </g>

  <!-- Predict flow box -->
  <rect x="1320" y="240" width="480" height="160" rx="18" fill="none" stroke="#47c978" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="1340" y="270" class="group-label">POST /api/predict flow</text>
  <text x="1560" y="310" class="box-sub">1. React form (city, area, rooms)</text>
  <text x="1560" y="345" class="box-sub">2. Go proxies to ML /predict</text>
  <text x="1560" y="380" class="box-sub">3. Dashboard: price, trend, 12m chart</text>

  <!-- Main arrows -->
  <line x1="380" y1="320" x2="518" y2="320" stroke="#3db8c4" stroke-width="4" marker-end="url(#prop-arrow)"/>
  <text x="450" y="302" class="edge-label">REST /api</text>

  <line x1="820" y1="310" x2="958" y2="310" stroke="#47c978" stroke-width="3" marker-end="url(#prop-arrow-green)"/>
  <text x="890" y="292" class="edge-label">/predict</text>

  <line x1="670" y1="400" x2="670" y2="518" stroke="#9aa0b4" stroke-width="3" marker-end="url(#prop-arrow-gray)"/>
  <text x="710" y="465" class="edge-label">SQL</text>

  <line x1="1110" y1="400" x2="1110" y2="478" stroke="#9aa0b4" stroke-width="2" stroke-dasharray="8 6"/>
  <line x1="1110" y1="478" x2="860" y2="590" stroke="#9aa0b4" stroke-width="2" marker-end="url(#prop-arrow-gray)"/>
  <text x="1010" y="520" class="edge-label">INSERT listings</text>

  <line x1="960" y1="590" x2="860" y2="590" stroke="#9aa0b4" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#prop-arrow-gray)"/>
  <text x="910" y="572" class="edge-label">SELECT train</text>

  <line x1="1110" y1="240" x2="1110" y2="228" stroke="#9aa0b4" stroke-width="2" stroke-dasharray="8 6"/>
  <line x1="1110" y1="228" x2="690" y2="228" stroke="#9aa0b4" stroke-width="2" stroke-dasharray="8 6"/>
  <line x1="690" y1="228" x2="690" y2="238" stroke="#9aa0b4" stroke-width="2" marker-end="url(#prop-arrow-gray)"/>
  <text x="900" y="218" class="edge-label">/retrain on new property</text>

  <!-- Legend -->
  <rect x="120" y="520" width="320" height="330" rx="16" fill="#252636" stroke="#3a3d52" stroke-width="2"/>
  <text x="280" y="558" class="box-title">Stack</text>
  <text x="144" y="596" class="legend-line">Go REST API + JWT</text>
  <text x="144" y="630" class="legend-line">Python ML Random Forest</text>
  <text x="144" y="664" class="legend-line">React + Recharts</text>
  <text x="144" y="698" class="legend-line">PostgreSQL 15</text>
  <text x="144" y="732" class="legend-line">Docker Compose 5 services</text>
  <text x="144" y="766" class="legend-line">Parser: 26 regions Russia</text>
  <text x="144" y="800" class="legend-tech">magistracy / TSPO project</text>

  <text x="960" y="1020" class="footer">github.com/dratbo/property-price-predictor</text>
</svg>
