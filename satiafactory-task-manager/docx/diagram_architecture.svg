<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#f5a623"/>
    </marker>
    <marker id="arrow-gray" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#9aa0b4"/>
    </marker>
    <linearGradient id="boxFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34344a"/>
      <stop offset="100%" stop-color="#2a2a3a"/>
    </linearGradient>
    <linearGradient id="accentFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f08a2e"/>
      <stop offset="100%" stop-color="#d96f18"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <style>
      .title { font-family: Segoe UI, Arial, sans-serif; font-size: 42px; font-weight: 700; fill: #ffffff; }
      .subtitle { font-family: Segoe UI, Arial, sans-serif; font-size: 22px; fill: #b8bfd0; }
      .box-title { font-family: Segoe UI, Arial, sans-serif; font-size: 26px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .box-sub { font-family: Segoe UI, Arial, sans-serif; font-size: 18px; fill: #d8dce8; text-anchor: middle; }
      .box-tech { font-family: Consolas, monospace; font-size: 16px; fill: #ffb86b; text-anchor: middle; }
      .edge-label { font-family: Segoe UI, Arial, sans-serif; font-size: 16px; fill: #c8cede; text-anchor: middle; }
      .group-label { font-family: Segoe UI, Arial, sans-serif; font-size: 20px; font-weight: 600; fill: #8f96ab; }
      .footer { font-family: Segoe UI, Arial, sans-serif; font-size: 20px; fill: #9aa0b4; text-anchor: middle; }
      .legend-line { font-family: Segoe UI, Arial, sans-serif; font-size: 18px; fill: #d8dce8; text-anchor: start; }
      .legend-tech { font-family: Consolas, monospace; font-size: 16px; fill: #ffb86b; text-anchor: start; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="#171722"/>
  <rect x="40" y="40" width="1840" height="1000" rx="24" fill="#1f2030" stroke="#3a3d52" stroke-width="2"/>

  <!-- Title -->
  <text x="960" y="110" class="title" text-anchor="middle">Satisfactory Task Manager</text>
  <text x="960" y="148" class="subtitle" text-anchor="middle">Go microservices | Docker Compose | VPS</text>

  <!-- Client -->
  <g filter="url(#shadow)">
    <rect x="80" y="220" width="220" height="100" rx="16" fill="url(#boxFill)" stroke="#f5a623" stroke-width="3"/>
    <text x="190" y="262" class="box-title">Browser</text>
    <text x="190" y="296" class="box-sub">React UI</text>
  </g>

  <!-- Gateway -->
  <g filter="url(#shadow)">
    <rect x="420" y="200" width="260" height="140" rx="16" fill="url(#accentFill)" stroke="#ffd099" stroke-width="3"/>
    <text x="550" y="252" class="box-title">Gateway</text>
    <text x="550" y="286" class="box-sub">Go | REST API</text>
    <text x="550" y="316" class="box-tech">:8080</text>
  </g>

  <!-- User service -->
  <g filter="url(#shadow)">
    <rect x="780" y="180" width="250" height="110" rx="16" fill="url(#boxFill)" stroke="#6c7cff" stroke-width="2"/>
    <text x="905" y="228" class="box-title">user-service</text>
    <text x="905" y="260" class="box-sub">JWT auth</text>
    <text x="905" y="284" class="box-tech">:8081</text>
  </g>

  <!-- NGINX -->
  <g filter="url(#shadow)">
    <rect x="780" y="330" width="250" height="110" rx="16" fill="url(#boxFill)" stroke="#47c978" stroke-width="2"/>
    <text x="905" y="378" class="box-title">NGINX LB</text>
    <text x="905" y="410" class="box-sub">round-robin</text>
    <text x="905" y="434" class="box-tech">:8090</text>
  </g>

  <!-- Data service -->
  <g filter="url(#shadow)">
    <rect x="780" y="480" width="250" height="110" rx="16" fill="url(#boxFill)" stroke="#6c7cff" stroke-width="2"/>
    <text x="905" y="528" class="box-title">data-service</text>
    <text x="905" y="560" class="box-sub">Satisfactory recipes</text>
    <text x="905" y="584" class="box-tech">:8083</text>
  </g>

  <!-- Task services group -->
  <rect x="1120" y="300" width="720" height="170" rx="18" fill="none" stroke="#47c978" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="1140" y="330" class="group-label">3 replicas | X-Instance-ID</text>

  <g filter="url(#shadow)">
    <rect x="1150" y="350" width="190" height="100" rx="14" fill="url(#boxFill)" stroke="#47c978" stroke-width="2"/>
    <text x="1245" y="392" class="box-title">task-service</text>
    <text x="1245" y="422" class="box-sub">tasks-1</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1385" y="350" width="190" height="100" rx="14" fill="url(#boxFill)" stroke="#47c978" stroke-width="2"/>
    <text x="1480" y="392" class="box-title">task-service</text>
    <text x="1480" y="422" class="box-sub">tasks-2</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1620" y="350" width="190" height="100" rx="14" fill="url(#boxFill)" stroke="#47c978" stroke-width="2"/>
    <text x="1715" y="392" class="box-title">task-service</text>
    <text x="1715" y="422" class="box-sub">tasks-3</text>
  </g>

  <!-- Data layer -->
  <g filter="url(#shadow)">
    <rect x="420" y="690" width="240" height="110" rx="16" fill="url(#boxFill)" stroke="#e06c9f" stroke-width="2"/>
    <text x="540" y="738" class="box-title">PostgreSQL</text>
    <text x="540" y="770" class="box-sub">users | tasks | recipes</text>
    <text x="540" y="794" class="box-tech">:5432</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="720" y="690" width="220" height="110" rx="16" fill="url(#boxFill)" stroke="#e06c9f" stroke-width="2"/>
    <text x="830" y="738" class="box-title">Redis</text>
    <text x="830" y="770" class="box-sub">GET /tasks cache</text>
    <text x="830" y="794" class="box-tech">X-Cache HIT/MISS</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1000" y="690" width="240" height="110" rx="16" fill="url(#boxFill)" stroke="#e06c9f" stroke-width="2"/>
    <text x="1120" y="738" class="box-title">RabbitMQ</text>
    <text x="1120" y="770" class="box-sub">fanout task.events</text>
    <text x="1120" y="794" class="box-tech">:5672</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1300" y="690" width="240" height="110" rx="16" fill="url(#boxFill)" stroke="#e06c9f" stroke-width="2"/>
    <text x="1420" y="738" class="box-title">task-worker</text>
    <text x="1420" y="770" class="box-sub">audit | cache warm</text>
    <text x="1420" y="794" class="box-tech">Go consumer</text>
  </g>

  <!-- Monitoring -->
  <g filter="url(#shadow)">
    <rect x="1600" y="690" width="240" height="110" rx="16" fill="url(#boxFill)" stroke="#58c4ff" stroke-width="2"/>
    <text x="1720" y="738" class="box-title">Prometheus</text>
    <text x="1720" y="770" class="box-sub">/metrics scrape</text>
    <text x="1720" y="794" class="box-tech">:9090</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1600" y="850" width="240" height="110" rx="16" fill="url(#boxFill)" stroke="#58c4ff" stroke-width="2"/>
    <text x="1720" y="898" class="box-title">Grafana</text>
    <text x="1720" y="930" class="box-sub">dashboards</text>
    <text x="1720" y="954" class="box-tech">:3001</text>
  </g>

  <!-- Main flow arrows -->
  <line x1="300" y1="270" x2="418" y2="270" stroke="#f5a623" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="360" y="252" class="edge-label">HTTP</text>

  <line x1="680" y1="240" x2="778" y2="235" stroke="#9aa0b4" stroke-width="3" marker-end="url(#arrow-gray)"/>
  <line x1="680" y1="285" x2="778" y2="385" stroke="#9aa0b4" stroke-width="3" marker-end="url(#arrow-gray)"/>
  <line x1="680" y1="310" x2="778" y2="535" stroke="#9aa0b4" stroke-width="3" marker-end="url(#arrow-gray)"/>

  <line x1="1030" y1="385" x2="1148" y2="400" stroke="#47c978" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1340" y1="450" x2="1383" y2="450" stroke="#47c978" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1575" y1="450" x2="1618" y2="450" stroke="#47c978" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Down to data -->
  <line x1="1245" y1="450" x2="1245" y2="620" stroke="#9aa0b4" stroke-width="2" stroke-dasharray="8 6"/>
  <line x1="1480" y1="450" x2="1480" y2="620" stroke="#9aa0b4" stroke-width="2" stroke-dasharray="8 6"/>
  <line x1="1715" y1="450" x2="1715" y2="620" stroke="#9aa0b4" stroke-width="2" stroke-dasharray="8 6"/>
  <line x1="1245" y1="620" x2="540" y2="688" stroke="#9aa0b4" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <line x1="1480" y1="620" x2="830" y2="688" stroke="#9aa0b4" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <line x1="1715" y1="620" x2="1120" y2="688" stroke="#9aa0b4" stroke-width="2" marker-end="url(#arrow-gray)"/>

  <line x1="1120" y1="800" x2="1298" y2="800" stroke="#9aa0b4" stroke-width="3" marker-end="url(#arrow-gray)"/>
  <text x="1210" y="782" class="edge-label">consume</text>

  <line x1="905" y1="290" x2="540" y2="688" stroke="#9aa0b4" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>

  <!-- Monitoring dashed -->
  <line x1="1720" y1="800" x2="1720" y2="848" stroke="#58c4ff" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1245" y1="430" x2="1600" y2="730" stroke="#58c4ff" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrow)"/>

  <!-- Legend box -->
  <rect x="80" y="690" width="300" height="270" rx="16" fill="#252636" stroke="#3a3d52" stroke-width="2"/>
  <text x="230" y="730" class="box-title">Stack</text>
  <text x="104" y="770" class="legend-line">Go microservices</text>
  <text x="104" y="805" class="legend-line">Docker Compose</text>
  <text x="104" y="840" class="legend-line">NGINX x3 replicas</text>
  <text x="104" y="875" class="legend-line">Redis | RabbitMQ</text>
  <text x="104" y="910" class="legend-line">Prometheus / Grafana</text>
  <text x="104" y="945" class="legend-tech">loadtest ~1800 RPS</text>

  <text x="960" y="1020" class="footer">github.com/dratbo/Test-KR2</text>
</svg>
